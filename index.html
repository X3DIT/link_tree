<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>@yung.krshn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      font-family: 'DM Sans', -apple-system, 'Helvetica Neue', sans-serif;
      color: #f0f0f0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background: #0c0d0f;
    }
    #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .page {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 64px 24px 80px;
    }
    .avatar-wrap {
      margin-bottom: 18px; opacity: 0;
      transform: translateY(14px) scale(0.92);
      animation: popIn 0.65s cubic-bezier(0.34,1.4,0.64,1) 0.1s forwards;
    }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
      object-position: center top;
      border: 2px solid rgba(255,255,255,0.22);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.65);
      display: block;
    }
    .username {
      font-size: 26px; font-weight: 600; letter-spacing: -0.5px;
      color: #f5f5f7; text-align: center;
      opacity: 0; transform: translateY(10px);
      animation: fadeUp 0.5s cubic-bezier(0.22,0.68,0,1.1) 0.22s forwards;
    }
    .socials {
      display: flex; align-items: center; gap: 12px; margin-top: 14px;
      opacity: 0; transform: translateY(8px);
      animation: fadeUp 0.5s cubic-bezier(0.22,0.68,0,1.1) 0.32s forwards;
    }
    .social-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.11);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .social-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }
    .social-btn svg { width: 17px; height: 17px; fill: rgba(255,255,255,0.80); }
    .spacer { height: 34px; }
    .links { width: 100%; max-width: 370px; display: flex; flex-direction: column; gap: 12px; }
    .link-btn {
      position: relative; display: flex; align-items: center; justify-content: center;
      padding: 17px 48px 17px 20px;
      background: rgba(60,62,70,0.72);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 100px; text-decoration: none; color: #f0f0f2;
      font-size: 14px; font-weight: 500; letter-spacing: -0.05px;
      text-align: center; line-height: 1.4;
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      transition: background 0.22s, border-color 0.22s,
                  transform 0.24s cubic-bezier(0.22,0.68,0,1.2), box-shadow 0.22s;
      opacity: 0; transform: translateY(20px);
      box-shadow: 0 2px 14px rgba(0,0,0,0.30);
    }
    .link-btn:nth-child(1){ animation: fadeUp 0.56s cubic-bezier(0.22,0.68,0,1.1) 0.44s forwards; }
    .link-btn:nth-child(2){ animation: fadeUp 0.56s cubic-bezier(0.22,0.68,0,1.1) 0.56s forwards; }
    .link-btn:nth-child(3){ animation: fadeUp 0.56s cubic-bezier(0.22,0.68,0,1.1) 0.68s forwards; }
    .link-btn:hover {
      background: rgba(80,84,95,0.84); border-color: rgba(255,255,255,0.20);
      transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .link-btn:active { transform: scale(0.974); transition-duration: 0.08s; }
    .link-btn .dots {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 3px; opacity: 0.38;
    }
    .link-btn .dots span { display: block; width: 3.5px; height: 3.5px; border-radius: 50%; background: #fff; }
    .footer {
      margin-top: 52px; display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      opacity: 0; animation: fadeIn 0.7s ease 0.9s forwards;
    }
    .footer-join {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; background: rgba(255,255,255,0.96);
      color: #1c1c1e; border-radius: 100px;
      font-size: 14px; font-weight: 500; letter-spacing: -0.1px;
      text-decoration: none; box-shadow: 0 2px 18px rgba(0,0,0,0.35);
      transition: background 0.2s, transform 0.2s;
    }
    .footer-join:hover { background: #fff; transform: translateY(-1px); }
    .footer-links { font-size: 11.5px; color: rgba(255,255,255,0.26); }
    .footer-links a { color: inherit; text-decoration: none; }
    .footer-links a:hover { color: rgba(255,255,255,0.5); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes popIn  { to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>

        g.addColorStop(0,'rgba(0,130,100,0.22)');g.addColorStop(0.3,'rgba(0,100,80,0.14)');g.addColorStop(0.6,'rgba(0,70,60,0.07)');g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        g = ctx.createRadialGradient(W*.22,H*.88,0,W*.22,H*.88,W*.32);
        g.addColorStop(0,'rgba(0,160,120,0.14)');g.addColorStop(0.5,'rgba(0,100,80,0.07)');g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        g = ctx.createRadialGradient(W*.08,H*.12,0,W*.08,H*.12,W*.28);
        g.addColorStop(0,'rgba(20,80,120,0.10)');g.addColorStop(0.6,'rgba(10,40,80,0.04)');g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        g = ctx.createRadialGradient(W*.80,H*.42,0,W*.80,H*.42,W*.18);
        g.addColorStop(0,'rgba(160,50,30,0.10)');g.addColorStop(0.5,'rgba(100,30,20,0.04)');g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        g = ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.85);
        g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.7,'rgba(0,0,0,0.10)');g.addColorStop(1,'rgba(0,0,0,0.50)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        const stars=[
          {x:0.18,y:0.28,r:1.6,alpha:0.85,cross:true},
          {x:0.72,y:0.18,r:1.0,alpha:0.45,cross:false},
          {x:0.55,y:0.10,r:0.7,alpha:0.30,cross:false},
          {x:0.38,y:0.22,r:0.6,alpha:0.25,cross:false},
          {x:0.85,y:0.32,r:0.8,alpha:0.35,cross:false},
          {x:0.60,y:0.38,r:0.5,alpha:0.20,cross:false},
          {x:0.12,y:0.52,r:0.7,alpha:0.28,cross:false},
          {x:0.90,y:0.60,r:0.6,alpha:0.22,cross:false},
          {x:0.30,y:0.68,r:0.5,alpha:0.18,cross:false},
          {x:0.76,y:0.74,r:0.8,alpha:0.20,cross:false},
          {x:0.46,y:0.80,r:0.6,alpha:0.16,cross:false},
          {x:0.78,y:0.40,r:1.1,alpha:0.60,cross:false,color:'rgba(220,100,60,'},
        ];
        stars.forEach(s=>{
          const sx=s.x*W,sy=s.y*H,color=s.color||'rgba(255,255,255,';
          ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);
          ctx.fillStyle=color+s.alpha+')';ctx.fill();
          if(s.cross){
            [{dx:0,dy:-1,len:10},{dx:0,dy:1,len:10},{dx:-1,dy:0,len:10},{dx:1,dy:0,len:8}].forEach(arm=>{
              const grad=ctx.createLinearGradient(sx,sy,sx+arm.dx*arm.len,sy+arm.dy*arm.len);
              grad.addColorStop(0,`rgba(255,255,255,${s.alpha*0.7})`);grad.addColorStop(1,'rgba(255,255,255,0)');
              ctx.beginPath();ctx.strokeStyle=grad;ctx.lineWidth=0.8;
              ctx.moveTo(sx,sy);ctx.lineTo(sx+arm.dx*arm.len,sy+arm.dy*arm.len);ctx.stroke();
            });
          }
        });
        const imageData=ctx.getImageData(0,0,W,H),data=imageData.data;
        for(let i=0;i<data.length;i+=4*3){const n=(Math.random()-.5)*10;data[i]=Math.min(255,Math.max(0,data[i]+n));data[i+1]=Math.min(255,Math.max(0,data[i+1]+n));data[i+2]=Math.min(255,Math.max(0,data[i+2]+n));}
        ctx.putImageData(imageData,0,0);
      }
      window.addEventListener('resize',resize);
      resize();
    })();
  </script>
